# Docker 이미지: linux/amd64 · linux/arm64 · linux/arm/v7 를 한 이름으로 GitHub Container Registry 에 올린다.
# - 태그(v*)를 올리면: ghcr.io/<owner>/cupang-agent:<버전> 과 :latest
# - Actions 탭에서 수동 실행하면: :edge
name: docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 실행 확인 (amd64 이미지로 계정 만들기 → 화면 열기)
        run: |
          docker buildx build --platform linux/amd64 --load -t wing-check .
          docker run -d --name wing -p 26118:26118 wing-check
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:26118/api/ping && break; sleep 1; done
          code=$(docker logs wing 2>&1 | grep -o "설정 코드: [0-9A-F]*" | tail -1 | awk '{print $3}')
          curl -s -c jar -b jar -o /dev/null -d "code=$code&user=ci-check&password=ci-check-pass1&confirm=ci-check-pass1" http://127.0.0.1:26118/setup
          for u in / /inventory /prices /register /settings /static/dark.css; do
            c=$(curl -s -b jar -o /dev/null -w "%{http_code}" "http://127.0.0.1:26118$u"); echo "$c $u"; [ "$c" = 200 ]
          done
          docker logs wing | tail -20

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cupang-agent
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
