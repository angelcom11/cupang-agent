# Docker 이미지: linux/amd64 · linux/arm64 · linux/arm/v7 를 한 이름으로 GitHub Container Registry 에 올린다.
# - 태그(v*)를 올리면: ghcr.io/<owner>/cupang-agent:<버전> 과 :latest
#   (베타처럼 '-' 가 든 태그는 버전 태그만 올리고 :latest 는 그대로 둔다)
# - Actions 탭에서 수동 실행하면: :edge
name: docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 실행 확인 (amd64 이미지로 계정 만들기 → 화면 열기)
        run: |
          docker buildx build --platform linux/amd64 --load -t wing-check .
          docker run -d --name wing -p 26118:26118 wing-check
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:26118/api/ping && break; sleep 1; done
          code=$(docker logs wing 2>&1 | grep -o "설정 코드: [0-9A-F]*" | tail -1 | awk '{print $3}')
          curl -s -c jar -b jar -o /dev/null -d "code=$code&user=ci-check&password=ci-check-pass1&confirm=ci-check-pass1" http://127.0.0.1:26118/setup
          for u in / /inventory /prices /keywords /register /register/new /settings /classic/ /static/dark.css; do
            c=$(curl -s -b jar -o /dev/null -w "%{http_code}" "http://127.0.0.1:26118$u"); echo "$c $u"; [ "$c" = 200 ]
          done
          docker logs wing | tail -20
          # 호스트 폴더(root 소유)를 /data 에 연결해도 뜨는지 (v0.7.1 에서 고친 문제)
          sudo mkdir -p /tmp/wing-bind && sudo chown root:root /tmp/wing-bind && sudo chmod 755 /tmp/wing-bind
          docker run -d --name wing-bind -p 26119:26118 -v /tmp/wing-bind:/data wing-check
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:26119/api/ping && break; sleep 1; done
          c=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:26119/); echo "bind-mount $c"; docker logs wing-bind | tail -5; [ "$c" = 302 ]

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cupang-agent
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # 베타(v0.11.0-beta.1 처럼 '-' 가 든 태그)는 latest 를 옮기지 않는다.
            # compose 가 :latest 를 쓰므로, 옮기면 베타가 모두의 운영 이미지가 된다.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
